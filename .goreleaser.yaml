version: 2

project_name: rov

builds:
  - main: ./cmd/rov
    binary: rov
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/labsbit/rov/internal/cli.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, docs/SPEC.md, skills/rov/SKILL.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
